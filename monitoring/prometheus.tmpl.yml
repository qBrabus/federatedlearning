global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'cadvisor-client'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'cadvisor-hub'
    static_configs:
      - targets: ['${PROXY_IP}:8081']

  - job_name: 'flower-hub'
    static_configs:
      - targets: ['${PROXY_IP}:9093']
