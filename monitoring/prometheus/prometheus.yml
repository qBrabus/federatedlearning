# Generated from monitoring/prometheus.tmpl.yml with PROXY_IP=127.0.0.1 by default.
# The deploy script overwrites this file with the actual proxy IP during remote deployments.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'cadvisor-client'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'cadvisor-hub'
    static_configs:
      - targets: ['${PROXY_IP}:8081']
